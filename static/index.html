<main class="qms-main">
  <form id="realLogin" class="card login-card" aria-label="Login">
    <h2>Login</h2>
    <div class="fields-two">
      <label>User
        <select id="rEmail" autocomplete="username" required>
          <option value="daniel.christianto85@gmail.com">Daniel</option>
        </select>
      </label>
      <label>Password
        <input id="rPassword" type="password" autocomplete="current-password" placeholder="Masukkan password" required>
      </label>
    </div>
    <button id="rLoginBtn" type="submit" class="cta" disabled>Login</button>
    <p class="error" id="rLoginError" role="alert"></p>
  </form>

<section id="real" class="card upload-card hidden" aria-label="Upload quotation Excel">
  <p class="upload-caption" id="uploadFileCaption">Pilih quotation supplier (.xlsx)</p>
  <label id="uploadAction" class="upload-primary upload-control">
    <span>↑ Upload Excel</span>
    <input id="rFile" type="file" accept=".xlsx" class="file-picker" aria-label="Pilih quotation supplier format XLSX" aria-describedby="uploadFileCaption">
  </label>
  <p id="selectedFileInfo" class="file-selection" aria-live="polite" hidden></p>
  <div id="realWorkspace" class="workspace-content">
    <div class="row between logout-row"><span aria-hidden="true"></span><button id="rLogout" class="small-link" type="button">Keluar</button></div>
    <div class="fields-two price-fields">
      <label>Margin (%)<input id="rMargin" type="number" min=".01" max="80" step=".01" value="15"></label>
      <label>Kurs USD/IDR<input id="rFx" type="number" min="1000" max="1000000" value="18300"></label>
    </div>
    <label class="full">Format hasil quotation<select id="rFormat">
      <option value="T01">CommVerge</option><option value="T02">Smartoptics</option><option value="BOTH">Keduanya</option>
    </select></label>
    <p id="rMasterStatus" class="minor" role="status" aria-live="polite">Master CommVerge: memeriksa template privat…</p>
    <div class="smalltools"><span class="minor">Detail opsional</span><div class="switches">
      <button type="button" class="switch active" data-r-mode="simple">Simple</button><button type="button" class="switch" data-r-mode="advanced">Advanced</button>
    </div></div>
    <section id="rAdvanced" class="fold advanced-fields"><div class="fields-two" id="rAdvancedFields"></div></section>
    <button id="rPreview" type="button" class="cta">Preview Hasil Quotation</button>
    <p id="rError" class="hint" role="alert"></p>
    <div id="rResults" hidden>
      <section class="worksheet-preview" aria-label="Review quotation">
        <div class="review-grid">
          <section class="visual-qa" aria-label="Hasil pemeriksaan quotation">
            <h3>Hasil pemeriksaan</h3>
            <ul id="rCompareChecks" class="qa-list" aria-live="polite"></ul>
          </section>
          <section class="review-preview" aria-label="Preview hasil quotation">
            <div class="row between worksheet-heading">
              <h3 class="subheading">Preview</h3>
              <div class="switches" role="group" aria-label="Jenis preview">
                <button id="rShowExcel" type="button" class="switch active" aria-pressed="true">Excel</button>
                <button id="rShowPdf" type="button" class="switch" aria-pressed="false">PDF</button>
              </div>
              <select id="rPreviewFormat" aria-label="Format quotation yang ditampilkan" hidden><option value="T01">CommVerge</option><option value="T02">Smartoptics</option></select>
            </div>
            <section id="rExcelPreview" aria-label="Preview Excel ">
              <div class="visual-document-card">
                <h4 id="rDraftTitle" class="sr-only">Quotation</h4>
                <div id="rDraftDocument" class="quote-paper" aria-label="Hasil quotation Excel"></div>
              </div>
            </section>
            <section id="rPdfPreview" class="pdf-preview" aria-label="Preview PDF A4" hidden>
              <p id="rPreviewMessage" class="minor" role="status" aria-live="polite" hidden></p>
              <iframe id="rPdfFrame" title="Preview PDF quotation A4" class="pdf-preview-frame" hidden></iframe>
            </section>
          </section>
        </div>
      </section>
      <label class="full">Download sebagai
        <select id="rExportType" aria-label="Pilih tipe file download">
          <option value="xlsx">Excel (.xlsx)</option>
          <option value="pdf">PDF (.pdf, A4)</option>
        </select>
      </label>
      <label class="ack"><input id="rAck" type="checkbox"> Saya sudah memeriksa item, harga dan terms.</label>
      <div class="download-summary">
        <div class="totalbox draft-total"><span>Total DRAFT <small>(sebelum pajak)</small></span><strong id="rUsd">—</strong><b id="rIdr">—</b></div>
        <div class="delivery-actions"><button id="rGenerate" class="cta" type="button" disabled>Download Excel</button><button id="rSendEmail" class="cta email-cta" type="button" disabled>Kirim ke Email</button></div>
      </div>
      <p id="rDeliveryStatus" class="hint" role="status" aria-live="polite" hidden></p>
    </div>
  </div>
</section>
